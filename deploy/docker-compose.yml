version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: privacy
      POSTGRES_PASSWORD: privacy123
      POSTGRES_DB: privacy_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg2://privacy:privacy123@postgres:5432/privacy_platform
      REDIS_URL: redis://redis:6379/0
    volumes:
      - evidence_data:/data/privacy-platform/evidence
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  evidence_data:
